<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    // Apply the saved theme and custom skin before the stylesheet resolves,
    // so first paint never flashes the default look before switching.
    // Keep in sync with skin.js's applyAll() if the storage shape changes.
    (function () {
      try {
        var t = localStorage.getItem('mfx.theme');
        if (t && t !== 'midnight') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
      try {
        var skin = JSON.parse(localStorage.getItem('mfx.customSkin') || '{}');
        var root = document.documentElement;
        var classFor = { bg: 'skin-bg', sliderTrack: 'skin-slider-track', sliderThumb: 'skin-slider-thumb', panelTexture: 'skin-panel' };
        var varFor = { bg: '--skin-bg-url', sliderTrack: '--skin-slider-track-url', sliderThumb: '--skin-slider-thumb-url', panelTexture: '--skin-panel-texture-url' };
        for (var slot in classFor) {
          var entry = skin[slot];
          if (entry && entry.path) {
            root.classList.add(classFor[slot]);
            root.style.setProperty(varFor[slot], 'url("' + 'file:///' + entry.path.replace(/\\/g, '/').replace(/ /g, '%20') + '?v=' + entry.v + '")');
          }
        }
      } catch (e) {}
    })();
  </script>
  <title>midFX</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">mid<em>FX</em></span>
      </div>
      <nav id="tabbar"></nav>
      <div class="top-actions">
        <div id="project-control"></div>
        <div class="top-status" id="top-status">READY</div>
        <button id="btn-home" class="icon-btn" type="button" title="Past Projects" aria-label="Past Projects">🏠</button>
        <button id="btn-settings" class="icon-btn" type="button" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </header>

    <main id="stage-wrap">
      <div class="hud-corner tl"></div><div class="hud-corner tr"></div>
      <div class="hud-corner bl"></div><div class="hud-corner br"></div>
      <div class="hud-plus" style="top:8px;left:50%"></div>
      <div class="hud-plus" style="bottom:8px;left:50%"></div>
      <div class="hud-plus" style="top:50%;left:8px"></div>
      <div class="hud-plus" style="top:50%;right:8px"></div>
      <div id="stage"></div>
    </main>

    <aside id="panel">
      <div id="panel-head"><span id="panel-title">—</span></div>
      <div id="panel-body"></div>
      <div id="panel-foot"></div>
    </aside>

    <footer id="statusbar">
      <span id="status-text">midFX v1.0 — OPERATIONAL</span>
      <div id="status-progress"><div id="status-progress-fill"></div></div>
    </footer>
  </div>

  <div id="toast"></div>

  <div id="launch-screen" class="hidden">
    <div class="launch-inner">
      <div class="launch-title">PAST PROJECTS</div>
      <div id="launch-grid" class="launch-grid"></div>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/skin.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/colorwheel.js"></script>
  <script src="js/palettes.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/fx_scanlines.js"></script>
  <script src="js/fx_bevel.js"></script>
  <script src="js/fx_dither.js"></script>
  <script src="js/fx_colorcorrect.js"></script>
  <script src="js/fx_airbrush.js"></script>
  <script src="js/fx_paperscan.js"></script>
  <script src="js/fx_reeded.js"></script>
  <script src="js/fx_trails.js"></script>
  <script src="js/fx_riso.js"></script>
  <script src="js/fx_gradient.js"></script>
  <script src="js/fx_noisegrain.js"></script>
  <script src="js/fx_pixelsort.js"></script>
  <script src="js/fx_presets.js"></script>
  <script src="js/tool_fx.js"></script>
  <script src="js/tool_type.js"></script>
  <script src="js/tool_grid.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
